name: Offline checks (never deploy)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-and-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: pip install -r app/requirements.txt pyyaml pytest
      - name: Compile Python
        run: python -m compileall -q app
      - name: Validate Kubernetes YAML syntax and objects
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for p in sorted(Path('k8s').rglob('*.yaml')):
              objs=list(yaml.safe_load_all(p.read_text()))
              assert objs and all(isinstance(o,dict) and o.get('apiVersion') and o.get('kind') for o in objs), p
              print('YAML parsed:',p)
          PY
      - name: Run mock API tests
        run: pytest -q
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Terraform fmt
        run: terraform -chdir=infra/terraform fmt -check
      - name: Terraform init (no backend or credentials)
        run: terraform -chdir=infra/terraform init -backend=false
      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate
