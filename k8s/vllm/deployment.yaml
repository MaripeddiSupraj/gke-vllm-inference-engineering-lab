# TEMPLATE ONLY: verify vLLM tag, model revision and GKE/T4 compatibility before live deployment.
# Use kubectl port-forward; no public LoadBalancer/Ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: inference-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.8.5
          args:
            - "--model"
            - "Qwen/Qwen2.5-0.5B-Instruct"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--max-model-len"
            - "2048"
            - "--gpu-memory-utilization"
            - "0.75"
            - "--enforce-eager"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              nvidia.com/gpu: "1"
              cpu: "2"
              memory: "6Gi"
            limits:
              nvidia.com/gpu: "1"
              memory: "12Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: model-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: model-cache
          emptyDir:
            sizeLimit: 10Gi
